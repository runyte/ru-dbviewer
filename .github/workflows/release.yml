name: Build release artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl compiler
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
      - name: Test packaged executable
        run: |
          target/${{ matrix.target }}/release/ru-dbviewer --version
          target/${{ matrix.target }}/release/ru-dbviewer --print-config
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install jsonschema
      - run: python tests/wire.py target/${{ matrix.target }}/release/ru-dbviewer
      - name: Archive
        shell: bash
        run: |
          mkdir -p dist/package
          python scripts/dependency_licenses.py dist/package/licenses ${{ matrix.target }}
          cp target/${{ matrix.target }}/release/ru-dbviewer README.md LICENSE THIRD_PARTY_NOTICES.md dist/package/
          tar -czf dist/ru-dbviewer-${{ matrix.target }}.tar.gz -C dist/package .
          python -c 'import hashlib,pathlib; p=next(pathlib.Path("dist").glob("*.tar.gz")); p.with_suffix(p.suffix+".sha256").write_text(hashlib.sha256(p.read_bytes()).hexdigest()+"  "+p.name+"\n")'
      - uses: actions/upload-artifact@v4
        with:
          name: ru-dbviewer-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
