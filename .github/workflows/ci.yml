name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            pg: '17'
          - os: ubuntu-24.04-arm
            pg: '16'
          - os: macos-15
            pg: '17'
          - os: macos-15-intel
            pg: '16'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install jsonschema
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Install PostgreSQL (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-${{ matrix.pg }}
          echo "PG_BIN=/usr/lib/postgresql/${{ matrix.pg }}/bin" >> "$GITHUB_ENV"
      - name: Install PostgreSQL (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install postgresql@${{ matrix.pg }}
          echo "PG_BIN=$(brew --prefix postgresql@${{ matrix.pg }})/bin" >> "$GITHUB_ENV"
      - name: Check out pinned Runyte host
        uses: actions/checkout@v4
        with:
          repository: runyte/runyte
          ref: ed379e93146a026208c9be884a7921a7d7e47356
          path: .host
      - name: Prepare Runyte 0.4 candidate
        id: host
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/.host/target
        run: python .host/docs/plugins/compatibility/candidate.py --source .host --candidate-version 0.4.0 --destination "$RUNNER_TEMP/runyte-candidate" --github-output "$GITHUB_OUTPUT"
      - name: Build pinned host
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/.host/target
        run: cargo build --locked --manifest-path "${{ steps.host.outputs.source }}/Cargo.toml"
      - name: Install coverage tools
        run: |
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov --locked --version 0.9.0
      - name: Behavior coverage (Rust, wire, PostgreSQL, native editor)
        shell: bash
        run: |
          cargo llvm-cov show-env --sh > "$RUNNER_TEMP/dbviewer-coverage-env.sh"
          source "$RUNNER_TEMP/dbviewer-coverage-env.sh"
          cargo clean -p ru-dbviewer
          cargo test --locked
          python tests/wire.py
          python tests/interactive.py
          python tests/full_values.py
          python tests/postgres_fixture.py
          python scripts/postgres_tests.py
          RUNYTE_BIN="$PWD/.host/target/debug/runyte" python tests/native.py
          cargo llvm-cov report --summary-only --fail-under-lines 75
  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: cargo check --locked --all-targets
